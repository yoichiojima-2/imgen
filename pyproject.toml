[project]
name = "imgen"
version = "0.1.0"
description = "Simple CLI for generating images with OpenAI's gpt-image-1."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "openai>=1.50",
    "rich>=13.7",
]

[project.scripts]
imgen = "imgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imgen"]
